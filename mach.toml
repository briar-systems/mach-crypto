[project]
id = "crypto"
version = "0.29.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.windows-aarch64]
arch = "aarch64"
sys = "windows"
abi = "aapcs64win"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[target.wasi-wasm32]
arch = "wasm32"
sys = "wasi"
env = "preview1"
abi = "basic"

[target.uefi-x86_64]
arch = "x86_64"
sys = "uefi"
abi = "win64"

[target.uefi-aarch64]
arch = "aarch64"
sys = "uefi"
abi = "aapcs64win"

[target.freestanding-x86_64]
arch = "x86_64"
sys = "freestanding"
abi = "sysv64"
isa = "x86-64"

[target.freestanding-aarch64]
arch = "aarch64"
sys = "freestanding"
abi = "aapcs64"
isa = "armv8-a+fp+simd"

[target.freestanding-riscv64]
arch = "riscv64"
sys = "freestanding"
abi = "lp64d"
isa = "rv64gc"

# the portable library, what a dependent's `use crypto;` binds: every module
# that needs nothing but the processor, on every declared target
[artifact.crypto]
kind = "static"
default = true
export = true
entry = "lib/crypto.mach"
out = "{project.work}/lib/crypto"
targets = ["*"]
link = ["kernel32"]
need = []

# the operating-system surface: the locked secret allocators and the entropy
# source, on the targets whose system has the pages and entropy capabilities
[artifact.system]
kind = "static"
entry = "lib/system.mach"
out = "{project.work}/lib/system"
targets = ["linux-x86_64", "linux-aarch64", "linux-riscv64", "windows-x86_64", "windows-aarch64",
    "darwin-x86_64", "darwin-aarch64", "wasi-wasm32"]
link = ["kernel32"]
need = []

# test-only: the library and every test module, run with `mach test . -a tests`
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/tests"
targets = ["linux-x86_64", "linux-aarch64", "linux-riscv64", "windows-x86_64", "windows-aarch64",
    "darwin-x86_64", "darwin-aarch64"]
link = ["kernel32"]
need = []

[link.kernel32]
source = "system"
name = "kernel32.dll"
sys = ["windows"]
arch = ["*"]
abi = ["*"]
export = false

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
