name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MACH_REF: bb7d6a3a09dbcb4123b931619075018b8173599f

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mach.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match mach.toml version $version"; exit 1; }

  # the hosts this project ships to, tested natively before anything is published
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      profile: release
      runners: '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-15", "macos-15-intel"]'

  # one archive per artifact and target, except the test-only `tests` artifact, cross-compiled at the paths mach's build plan reports
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - name: restore the pinned mach
        id: mach
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - id: src
        if: steps.mach.outputs.cache-hit != 'true'
        env:
          MACH_REF: ${{ env.MACH_REF }}
        run: |
          src=$RUNNER_TEMP/mach-src
          rm -rf "$src"
          git init --quiet "$src"
          git -C "$src" remote add origin https://github.com/briar-systems/mach
          git -C "$src" fetch --quiet --depth 1 origin "$MACH_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          if command -v sha256sum >/dev/null; then
            chain=$(sha256sum "$src/.github/bootstrap-chain" | awk '{print $1}')
          else
            chain=$(shasum -a 256 "$src/.github/bootstrap-chain" | awk '{print $1}')
          fi
          echo "chain=$chain" >> "$GITHUB_OUTPUT"
      - id: chain
        if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
          restore-keys: |
            chain-${{ runner.os }}-${{ runner.arch }}-
      - name: build mach at MACH_REF
        if: steps.mach.outputs.cache-hit != 'true'
        run: |
          (cd "$RUNNER_TEMP/mach-src" && GITHUB_ENV="$RUNNER_TEMP/mach.env" bash .github/scripts/bootstrap.sh)
          mkdir -p "$RUNNER_TEMP/mach"
          cp "$(sed -n 's/^MACH=//p' "$RUNNER_TEMP/mach.env" | tail -n 1)" "$RUNNER_TEMP/mach/mach"
      - if: steps.mach.outputs.cache-hit != 'true' && steps.chain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/chain
          key: chain-${{ runner.os }}-${{ runner.arch }}-${{ steps.src.outputs.chain }}
      - if: steps.mach.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mach
          key: mach-${{ runner.os }}-${{ runner.arch }}-${{ env.MACH_REF }}
      - name: add mach to PATH
        run: echo "$RUNNER_TEMP/mach" >> "$GITHUB_PATH"
      - run: mach dep pull .
      - run: mach build . --all -p release
      - name: package
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          mach build . --all -p release --plan | awk '
            /^unit / { name = $3; for (i = 4; i < NF; i++) if ($i == "target") target = $(i + 1) }
            $1 == "tuple" { split($2, t, "-"); os = t[2] }
            $1 == "out" && name != "tests" { print name, target, os, $2 }' |
          while read -r name target os path; do
            archive="$PWD/dist/$name-$version-$target"
            case "$os" in
              windows) (cd "$(dirname "$path")" && zip -q "$archive.zip" "$(basename "$path")") ;;
              *)       tar -czf "$archive.tar.gz" -C "$(dirname "$path")" "$(basename "$path")" ;;
            esac
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # a doubled tag push waits on the concurrency group, then finds the release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # notes are the changelog section for this version when there is one
          notes=$(awk -v v="${TAG#v}" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md 2>/dev/null || true)
          flags=(--verify-tag --title "$TAG" --draft)
          [ -n "$notes" ] && flags+=(--notes "$notes") || flags+=(--generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"
          gh release edit "$TAG" --draft=false
