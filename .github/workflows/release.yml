name: Release

# the shared release pipeline from briar-systems/.github. a pushed v* tag is
# verified against mach.toml and CHANGELOG.md, runs the full ci tier including
# tools/assurance, and is published. a dispatch rehearses the same path.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    with:
      stage: verify

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      heavy: all

  publish:
    needs: [verify, ci]
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    permissions:
      contents: write
    with:
      stage: publish
