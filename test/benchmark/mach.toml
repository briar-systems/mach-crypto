[project]
id = "crypto-benchmark"
version = "0.0.0"
mach = "^6"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-aarch64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "aapcs64"

[profile.debug]
optimize = false
debug = false
simd = "scalarize"

[profile.release]
default = true
optimize = true
debug = false
simd = "scalarize"

[artifact.benchmark]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/benchmark"
targets = ["*"]
link = []
need = []

[dep.crypto]
path = "../.."

# std is pinned here because a path dependency carries no pin for a
# dependency it selects by version, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
